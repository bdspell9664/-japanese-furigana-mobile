<!DOCTYPE html>
<html lang="ja-JP">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阅读助手">
<meta name="theme-color" content="#d43d3d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>日文阅读助手</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ═══ Header ═══ -->
<header class="app-header">
  <div class="app-title">日文閱讀<span>by bdspell</span></div>
  <div class="header-actions">
    <button class="header-btn" id="btnDark" title="深色主题">🌙</button>
    <button class="header-btn" id="btnSettings" title="设置">⚙️</button>
  </div>
</header>

<!-- ═══ Main Content ═══ -->
<main class="main-content">

  <!-- ── Tab 0: Discover ── -->
  <div class="tab-panel active" id="discoverPanel">
    <div class="discover-search"><input type="text" id="discoverSearch" placeholder="搜索单词…" autocomplete="off"></div>
    <div class="quick-import-wrap">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px">📋 快速开始</div>
      <textarea id="quickImport" placeholder="粘贴日文文本…"></textarea>
      <button class="btn btn-primary" id="btnQuickImport" style="width:100%;justify-content:center;margin-top:8px">📖 导入并解析</button>
    </div>
    <div class="feed-section" id="nhkFeed">
      <div class="feed-header"><span class="feed-title">📰 NHK Easy News</span><button class="btn-ghost" id="btnRefreshFeed">刷新</button></div>
      <div class="feed-grid" id="feedList"><div class="feed-loading" style="grid-column:1/-1;text-align:center">加载中…</div></div>
    </div>
    <div class="feed-section">
      <div class="feed-header"><span class="feed-title">📚 词单</span><button class="btn-ghost" id="btnNewList">+ 新建</button></div>
      <div class="list-row" id="listOverview"></div>
    </div>
  </div>

  <!-- ── Tab 1: Reading ── -->
  <div class="tab-panel" id="readingPanel">
    <div class="feed-section">
      <div class="feed-header"><span class="feed-title">📋 阅读</span></div>
      <textarea id="textInput" placeholder="输入日文文本，或点击文章…" style="width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;line-height:1.7;resize:none;background:var(--bg2);color:var(--text);outline:none;font-family:var(--sans)"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="btnAnnotate">🔍 解析</button>
        <button class="btn btn-secondary btn-small" id="btnPaste">📋 粘贴</button>
        <button class="btn btn-ghost btn-small" id="btnSpeakAll">🔊 朗读</button>
        <div class="jlpt-row"><span id="jlptLabel" style="font-size:10px;font-weight:700;color:var(--accent)">N3</span><input type="range" class="jlpt-slider" id="jlptSlider" min="1" max="5" value="3" step="1"></div>
      </div>
      <div class="url-row"><input type="url" id="urlInput" placeholder="网址…"><button class="btn btn-ghost btn-small" id="btnFetch">🔗</button></div>
    </div>
    <div class="reading-view" id="readingView"></div>
  </div>

  <!-- ── Tab 2: Analysis ── -->
  <div class="tab-panel" id="analysisPanel">
    <div id="analysisView"><div class="ana-empty">解析后自动显示深度分析</div></div>
  </div>

  <!-- ── Tab 3: Saved ── -->
  <div class="tab-panel" id="savedPanel">
    <div class="saved-search">
      <input type="text" id="savedSearch" placeholder="过滤收藏…">
      <button class="saved-sort" id="btnSavedSort">⇅ 排序</button>
    </div>
    <div class="list-nav" style="display:flex;gap:6px;margin-bottom:var(--space-sm);align-items:center">
      <select id="listSelector" class="list-select" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;background:var(--bg);color:var(--text);outline:none"></select>
      <button class="btn-ghost btn-small" id="btnRenameList">重命名</button>
      <button class="btn-ghost btn-small" id="btnDeleteList">删除</button>
    </div>
    <div id="savedView" class="saved-empty">还没有收藏的单词</div>
  </div>

  <!-- ── Tab 4: Review ── -->
  <div class="tab-panel" id="reviewPanel">
    <div class="review-setup" id="reviewSetup">
      <div class="review-pick">
        <select id="reviewListSelect"></select>
      </div>
      <div class="review-progress-ring">
        <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fg" id="ringFg" cx="30" cy="30" r="26" stroke-dasharray="163.36"/></svg>
        <div class="ring-label" id="reviewStats">0</div>
      </div>
      <button class="btn btn-primary" id="btnStartReview">开始复习</button>
    </div>
    <div class="flashcard" id="flashcard" style="display:none">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front" id="cardFront">
          <div class="card-word" id="cardWord"></div>
          <div class="card-reading" id="cardReading"></div>
          <button class="btn btn-ghost card-speak">🔊</button>
        </div>
        <div class="card-face card-back" id="cardBack">
          <div class="card-word" id="cardBackWord"></div>
          <div class="card-reading" id="cardBackReading"></div>
          <div class="card-pos" id="cardPos"></div>
          <div class="card-conj" id="cardConj"></div>
          <div class="card-def" id="cardDef"></div>
          <div class="card-ex" id="cardEx"></div>
          <button class="btn btn-ghost card-speak">🔊</button>
        </div>
      </div>
      <div class="card-actions" id="cardActions" style="display:none">
        <button class="btn btn-secondary btn-rate" data-rating="1">难 😰</button>
        <button class="btn btn-secondary btn-rate" data-rating="2">一般 🤔</button>
        <button class="btn btn-primary btn-rate" data-rating="3">简单 😊</button>
      </div>
      <div style="text-align:center;margin-top:var(--space-sm);font-size:11px;color:var(--text3)">
        <span id="reviewProgress"></span> · <button class="btn-ghost btn-small" id="btnEndReview">结束</button>
      </div>
    </div>
  </div>

</main>

<!-- ═══ Bottom Dock ═══ -->
<nav class="dock">
  <button class="dock-btn active" data-idx="0"><span class="dock-icon">🔍</span>发现</button>
  <button class="dock-btn" data-idx="1"><span class="dock-icon">📖</span>阅读</button>
  <button class="dock-btn" data-idx="2"><span class="dock-icon">🔬</span>分析</button>
  <button class="dock-btn" data-idx="3"><span class="dock-icon">⭐</span>收藏</button>
  <button class="dock-btn" data-idx="4"><span class="dock-icon">🃏</span>复习</button>
</nav>

<!-- ═══ Word Detail Sheet ═══ -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="word-sheet" id="wordSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-top">
    <div><div class="sheet-word" id="sheetWord"></div><div class="sheet-reading" id="sheetReading"></div></div>
    <div class="sheet-tags" id="sheetTags"></div>
  </div>
  <div class="sheet-tab-bar">
    <button class="sheet-tab active" data-tab="def">释义</button>
    <button class="sheet-tab" data-tab="grammar">语法</button>
    <button class="sheet-tab" data-tab="ex">例句</button>
  </div>
  <!-- 释义 -->
  <div class="sheet-tab-content active" id="tabDef">
    <div class="sheet-def" id="sheetDef"></div>
  </div>
  <!-- 语法 -->
  <div class="sheet-tab-content" id="tabGrammar">
    <div class="sheet-role" id="sheetRole"></div>
    <div class="sheet-conjug" id="sheetConjug"></div>
    <div class="sheet-usage" id="sheetGNote" style="display:none"></div>
  </div>
  <!-- 例句 -->
  <div class="sheet-tab-content" id="tabEx">
    <div class="sheet-ex" id="sheetEx"></div>
  </div>
  <div class="sheet-list-pills" id="sheetListPills"></div>
  <div class="sheet-actions">
    <button class="btn btn-primary" id="btnSaveWord">☆ 收藏</button>
    <button class="btn btn-ghost" id="btnSheetSpeak">🔊 朗读</button>
  </div>
</div>

<!-- ═══ Settings Bottom Sheet ═══ -->
<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-sheet" id="settingsSheet">
  <div class="sheet-handle"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-md)">
    <h3 style="font-size:15px;font-weight:700;color:var(--accent)">设置</h3>
    <button class="header-btn" id="settingsClose">✕</button>
  </div>
  <div class="field">
    <label>DeepSeek API Key</label>
    <input type="password" id="settingsApiKey" placeholder="sk-..." autocomplete="off">
  </div>
  <div class="field">
    <label>JLPT 级别：<span id="settingsJlptVal" style="color:var(--accent)">N3</span></label>
    <input type="range" id="settingsJlpt" min="1" max="5" value="3" step="1" style="width:100%">
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text3);margin-top:2px">
      <span>N1</span><span>N2</span><span>N3</span><span>N4</span><span>N5</span>
    </div>
  </div>
  <div class="field">
    <label>标注层</label>
    <div class="layer-toggles">
      <div class="layer-row"><span>假名</span><label class="toggle"><input type="checkbox" id="lyrFurigana" checked><span class="track"></span></label></div>
      <div class="layer-row"><span>罗马音</span><label class="toggle"><input type="checkbox" id="lyrRomaji"><span class="track"></span></label></div>
      <div class="layer-row"><span>词性</span><label class="toggle"><input type="checkbox" id="lyrPos" checked><span class="track"></span></label></div>
      <div class="layer-row"><span>动词分类</span><label class="toggle"><input type="checkbox" id="lyrVerb"><span class="track"></span></label></div>
      <div class="layer-row"><span>词源</span><label class="toggle"><input type="checkbox" id="lyrEtym"><span class="track"></span></label></div>
      <div class="layer-row"><span>文法角色</span><label class="toggle"><input type="checkbox" id="lyrGrammar" checked><span class="track"></span></label></div>
      <div class="layer-row"><span>句子分段</span><label class="toggle"><input type="checkbox" id="lyrSegments" checked><span class="track"></span></label></div>
    </div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
